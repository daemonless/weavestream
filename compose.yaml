name: weavestream

x-daemonless:
  title: "Weavestream"
  icon: ":material-server-network:"
  category: "Productivity"
  description: "Open-source, self-hosted IT documentation and asset management platform built around a relational knowledge model."
  upstream_url: "https://github.com/Weavestream/Weavestream"
  web_url: "https://weavestream.io"
  freshports_url: ""
  type: stack
  user: "bsd"
  mlock: false
  upstream_binary: false
  appjail: true
  community: "Discord:https://discord.gg/weavestream"

  # Which service goes where when this stack is put on a network: the web UI
  # is the one people open; the api, worker, database and cache stay private.
  networking:
    web: default
    "*": private

  # The bundled PostgreSQL, or one the person already runs. Not a dbuild
  # database choice: both api and worker read one DATABASE_URL.
  choices:
    database:
      label: Database
      doc: Where Weavestream keeps its data.
      default: bundled
      options:
        bundled:
          label: "Bundled PostgreSQL"
          doc: One more container, its data under DATA_DIR/postgres.
        external:
          label: "Your own PostgreSQL"
          doc: >-
            A PostgreSQL you already run; the database must exist and the
            user must own it. Scheduled backups run pg_dump 16, which refuses
            a newer server: use PostgreSQL 16 or older.
          drop: [postgres]
          ask:
            - { name: POSTGRES_HOST, label: Host }
            - { name: POSTGRES_PORT, label: Port, default: "5432" }
            - { name: POSTGRES_USER, label: User, default: weavestream }
            - { name: POSTGRES_PASSWORD, label: Password, type: secret }
            - { name: POSTGRES_DB, label: Database, default: weavestream }

  docs:
    env:
      PUID: "User ID for the container processes"
      PGID: "Group ID for the container processes"
      TZ: "Timezone for the containers"
      POSTGRES_USER: "PostgreSQL database user (default: weavestream)"
      POSTGRES_PASSWORD: "Password for the PostgreSQL database; URL-encode any @ : / # in it"
      POSTGRES_HOST: "PostgreSQL server (default: the bundled postgres service)"
      POSTGRES_PORT: "PostgreSQL port (default: 5432)"
      POSTGRES_DB: "PostgreSQL database name (default: weavestream)"
      APP_URL:
        desc: "Address you open Weavestream at, e.g. https://weavestream.example.com (default: http://localhost:3000)"
        public_url: true
      API_URL: "Public URL of the API (default: http://localhost:3000/api)"
      DATA_DIR: "Folder for uploads, backups, the database and the cache"
      WEB_HOST_PORT: "Published host port for the web UI (default: 3000)"
      TRUST_PROXY_HOPS: "Reverse proxy hops in front of the web UI, 0 when exposed directly (default: 1)"
      # Seven keys fjord makes up at install: nothing to type, so they sit
      # under Advanced. Losing one after data is written under it is
      # unrecoverable.
      JWT_SIGNING_KEY:
        desc: "Signs sign-in tokens"
        level: advanced
      MFA_ENCRYPTION_KEY:
        desc: "Encrypts two-factor (TOTP) secrets; without it two-factor sign-in stops working"
        level: advanced
      PASSWORD_ENCRYPTION_KEY:
        desc: "Encrypts the passwords stored in Weavestream; without it they cannot be read"
        level: advanced
      INTEGRATION_SECRET_KEY:
        desc: "Encrypts integration credentials; without it they cannot be read"
        level: advanced
      SMTP_SECRET_KEY:
        desc: "Encrypts the mail server password; without it mail stops"
        level: advanced
      COOKIE_SIGNING_KEY:
        desc: "Signs browser cookies"
        level: advanced
      CSRF_SIGNING_KEY:
        desc: "Signs the tokens that guard forms against cross-site requests"
        level: advanced
    ports:
      3000: "Weavestream Web UI (Next.js)"
    volumes:
      /var/lib/weavestream/files: "Uploaded attachments and documents"
      /var/lib/weavestream/backup: "Scheduled database backup dumps"
      /var/lib/postgresql/data: "PostgreSQL database storage"
      /config: "Redis persistence storage"

services:
  postgres:
    image: ghcr.io/daemonless/postgres:16
    container_name: weavestream-postgres
    restart: always
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weavestream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weavestream}
      POSTGRES_DB: ${POSTGRES_DB:-weavestream}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data

  redis:
    image: ghcr.io/daemonless/redis:latest
    container_name: weavestream-redis
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_DIR}/redis:/config

  api:
    image: ghcr.io/daemonless/weavestream-api:latest
    container_name: weavestream-api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgresql://${POSTGRES_USER:-weavestream}:${POSTGRES_PASSWORD:-weavestream}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-weavestream}
      REDIS_URL: redis://redis:6379/0
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3000/api}
      FILE_STORAGE_DIR: /var/lib/weavestream/files
      BACKUP_STORAGE_DIR: /var/lib/weavestream/backup
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      PASSWORD_ENCRYPTION_KEY: ${PASSWORD_ENCRYPTION_KEY}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY}
      SMTP_SECRET_KEY: ${SMTP_SECRET_KEY}
      COOKIE_SIGNING_KEY: ${COOKIE_SIGNING_KEY}
      CSRF_SIGNING_KEY: ${CSRF_SIGNING_KEY}
    volumes:
      - ${DATA_DIR}/files:/var/lib/weavestream/files
      - ${DATA_DIR}/backup:/var/lib/weavestream/backup:ro

  worker:
    image: ghcr.io/daemonless/weavestream-worker:latest
    container_name: weavestream-worker
    restart: always
    depends_on:
      - redis
      - api
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgresql://${POSTGRES_USER:-weavestream}:${POSTGRES_PASSWORD:-weavestream}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-weavestream}
      REDIS_URL: redis://redis:6379/0
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3000/api}
      FILE_STORAGE_DIR: /var/lib/weavestream/files
      BACKUP_STORAGE_DIR: /var/lib/weavestream/backup
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      PASSWORD_ENCRYPTION_KEY: ${PASSWORD_ENCRYPTION_KEY}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY}
      SMTP_SECRET_KEY: ${SMTP_SECRET_KEY}
      COOKIE_SIGNING_KEY: ${COOKIE_SIGNING_KEY}
      CSRF_SIGNING_KEY: ${CSRF_SIGNING_KEY}
    volumes:
      - ${DATA_DIR}/files:/var/lib/weavestream/files
      - ${DATA_DIR}/backup:/var/lib/weavestream/backup

  web:
    image: ghcr.io/daemonless/weavestream-web:latest
    container_name: weavestream-web
    restart: always
    depends_on:
      - api
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      API_INTERNAL_URL: http://api:4000
      COOKIE_SIGNING_KEY: ${COOKIE_SIGNING_KEY}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
